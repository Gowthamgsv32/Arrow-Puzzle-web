name: தமிழ்
tts_voice: ta-IN-PallaviNeural

intents:
  greet: [வணக்கம், ஹலோ, காலை வணக்கம், மாலை வணக்கம்]
  time: [நேரம் என்ன, மணி என்ன, இப்போது நேரம் என்ன, மணி எத்தனை]
  date: [தேதி என்ன, இன்று தேதி என்ன, இன்று என்ன கிழமை]
  # Tamil is verb-final: "யூடியூப் திற" -> open youtube
  open: [திற, திறக்கவும், திறந்து விடு, ஓபன் பண்ணு, ஓபன்]
  search: [தேடு, தேடவும், சர்ச் பண்ணு, சர்ச்]
  exit: [போய் வருகிறேன், நிறுத்து, பை, வெளியேறு]

responses:
  greet: ["வணக்கம்! நான் உங்களுக்கு எப்படி உதவலாம்?", "வணக்கம்! என்ன செய்ய வேண்டும்?"]
  time: "இப்போது நேரம் {time}."
  date: "இன்று {date}."
  opening: "{target} திறக்கிறேன்."
  open_missing: "எதை திறக்க வேண்டும்?"
  open_failed: "மன்னிக்கவும், {target} திறக்க முடியவில்லை."
  searching: "{query} தேடுகிறேன்."
  search_missing: "எதைத் தேட வேண்டும்?"
  exit: "போய் வாருங்கள்!"
  unknown: "மன்னிக்கவும், எனக்கு புரியவில்லை."
  listening: "கேட்கிறேன்..."
