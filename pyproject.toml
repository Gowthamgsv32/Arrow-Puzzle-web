[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-assistant"
version = "0.1.0"
description = "A multilingual (English + Tamil) voice-controlled desktop personal assistant."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
voice = [
    "numpy>=1.24",
    "sounddevice>=0.4.6",
    "soundfile>=0.12",
    "faster-whisper>=1.0",
    "edge-tts>=6.1",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
personal-assistant = "personal_assistant.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
personal_assistant = ["locales/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
